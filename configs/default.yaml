seed: 42
dataset_root: data/DS1000Retrieval
output_dir: artifacts/ds1000
test_size: 0.8
embedding_models:
  - text-embedding-3-small
embedding_device: cpu
# Supported rewards: ranking, dense, hybrid
reward_function: ranking
policy_model: Qwen/Qwen3-4B-Instruct-2507

doc-tranform:
  transform-instruction: |
    Improve this code snippet.
    You may:
    - Add a short natural-language summary.
    - Add comments where helpful.
    - Rename variables or refactor for readability.
    STRICT RULES:
    - DO NOT change the behavior or functionality of the source document.
    - Preserve the exact input-output semantics.
    - Do not add facts, assumptions, or code behavior that is not supported by the source.
    - Keep the output concise and high-signal.
    Return only the updated code with comments/documentation.
    Do not add text outside the code.
  batch_size: 64
  max_tokens: 1024
  temperature: 0.3
  top_p: 0.8
  top_k: 20
  repetition_penalty: 1.0
  presence_penalty: 0.0

doc-opt:
  max_steps: 1000
  refresh_rate: 100
  checkpoint_save_rate: 500
  temperature: 0.7
  per_device_train_batch_size: 24
  num_generations: 6
  learning_rate: 1.0e-5
  kl_beta: 0.1
  max_completion_length: 1024

vllm:
  dtype: bfloat16
  gpu_memory_utilization: 0.7
  max_model_len: 10000
  enforce_eager: true
  use_deep_gemm: false
  enable_v1_multiprocessing: false
